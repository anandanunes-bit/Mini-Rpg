<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guardião da Floresta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-container">
        <header class="game-header">
            <p class="game-subtitle">Mini RPG em JavaScript</p>
            <h1>Guardião da Floresta</h1>
            <p>Derrote a criatura antes que sua energia acabe.</p>
        </header>

        <section class="status-grid">
            <article class="character-card player-card">
                <div class="character-symbol">G</div>
                <h2>Guardião</h2>
                <p id="player-health-text">100 / 100</p>
                <div class="health-track">
                    <div id="player-health-bar" class="health-bar player-health"></div>
                </div>
                <p>Poções: <span id="potion-count">3</span></p>
                <p id="defense-status">Defesa inativa</p>
            </article>

            <div class="vs">VS</div>

            <article class="character-card enemy-card">
                <div class="character-symbol">S</div>
                <h2 id="enemy-name">Slime Sombrio</h2>
                <p id="enemy-health-text">80 / 80</p>
                <div class="health-track">
                    <div id="enemy-health-bar" class="health-bar enemy-health"></div>
                </div>
                <p>Criatura da floresta corrompida</p>
            </article>
        </section>

        <p id="turn-message" class="turn-message">Escolha sua primeira ação.</p>

        <section class="actions">
            <button id="attack-button" class="action-button">Atacar</button>
            <button id="defend-button" class="action-button">Defender</button>
            <button id="heal-button" class="action-button">Usar poção</button>
            <button id="restart-button" class="action-button secondary" hidden>Reiniciar</button>
        </section>

        <section class="log-section">
            <h3>Histórico da batalha</h3>
            <ul id="battle-log" class="battle-log"></ul>
            <button id="clear-save-button" class="clear-button">Apagar progresso salvo</button>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
